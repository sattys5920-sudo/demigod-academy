<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>데미갓 아카데미 입장</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Gasoek+One&family=Gothic+A1:wght@400;700;900&display=swap">
<style>
:root{
  --bg:#14061F;
  --panel:#1E0B2C;
  --line:#FFFFFF;
  --lime:#C6FF3D;
  --pink:#FF2E93;
  --t1:#E4D8EE;
  --t2:#B7A5C4;
  --t3:#9B86AD;
  --dim:#3B2450;
  --ink:#14061F;
  --disp:'Gasoek One','Gothic A1',sans-serif;
  --num:'Archivo Black','Gothic A1',sans-serif;
  --body:'Gothic A1',system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--bg); color:var(--t1);
  font-family:var(--body); -webkit-font-smoothing:antialiased;
}
.halftone{
  position:fixed; inset:0; pointer-events:none; z-index:3;
  background-image:radial-gradient(#FFFFFF 1.4px, transparent 1.5px);
  background-size:16px 16px; opacity:.07;
}
button{font-family:inherit}
[hidden]{display:none !important}
:focus-visible{outline:4px solid var(--pink); outline-offset:3px}

.stage{
  position:relative; width:100%; max-width:1280px; min-height:832px;
  margin:0 auto; display:flex; flex-direction:column; overflow:hidden;
}
.blob{
  position:absolute; width:520px; height:520px; border-radius:50%;
  background:var(--lime); opacity:.18; top:-150px; left:-130px;
  z-index:0; pointer-events:none;
}

/* header */
.hd{
  position:relative; z-index:2; height:92px; flex:0 0 92px;
  display:flex; align-items:center; gap:16px; padding:0 26px;
  border-bottom:5px solid var(--line); background:var(--bg);
}
.logo{
  width:52px; height:52px; flex:0 0 52px; border-radius:50%;
  background:var(--lime); border:4px solid var(--line);
  display:flex; align-items:center; justify-content:center;
}
.wordmark{font-family:var(--disp); font-size:26px; color:var(--line); white-space:nowrap}
.spacer{flex:1 1 auto}
.build{
  min-height:44px; display:inline-flex; align-items:center; gap:10px;
  padding:0 20px; border-radius:999px;
  background:var(--line); border:4px solid var(--line); color:var(--ink);
}
.build .lbl{font-family:var(--num); font-size:11px; letter-spacing:.14em}
.build .val{font-family:var(--num); font-size:15px}

/* centered auth */
.body{
  position:relative; z-index:2; flex:1 1 auto;
  display:flex; align-items:center; justify-content:center;
  padding:26px;
}
.auth{
  width:100%; max-width:460px; display:flex; flex-direction:column; gap:20px;
  padding:26px; border-radius:28px;
  background:var(--line); color:var(--ink); border:5px solid var(--ink);
  box-shadow:10px 10px 0 var(--lime);
}
.seg{display:flex; gap:12px}
.seg-btn{
  flex:1 1 0; min-height:52px; border-radius:999px; cursor:pointer;
  border:4px solid var(--ink); background:transparent; color:var(--ink);
  font-family:var(--disp); font-size:18px;
}
.seg-btn:hover{background:#EFE6F6}
.seg-btn[aria-selected="true"]{background:var(--lime); box-shadow:6px 6px 0 var(--ink)}
.pane{display:flex; flex-direction:column; gap:18px}
.field{display:flex; flex-direction:column; gap:6px}
.field label{font-family:var(--num); font-size:11px; letter-spacing:.14em; color:#5B4470}
.inputwrap{position:relative; display:flex}
.field input{
  width:100%; min-height:56px; padding:0 16px;
  border-radius:18px; border:4px solid var(--ink); background:var(--line);
  color:var(--ink); font-family:var(--body); font-size:16px; font-weight:700;
}
.field input::placeholder{color:#9B86AD; font-weight:400}
.field input:focus{background:#F6F1FA}
.peek{
  position:absolute; right:8px; top:50%; transform:translateY(-50%);
  width:44px; height:44px; border-radius:50%; border:0; background:transparent;
  color:var(--ink); cursor:pointer; display:flex; align-items:center; justify-content:center;
}
.peek:hover{background:#EFE6F6}
.remember{display:flex; align-items:center; gap:12px; min-height:44px; cursor:pointer}
.remember input{width:26px; height:26px; accent-color:#14061F; margin:0}
.remember span{font-size:14px; font-weight:700}
.msg:empty{display:none}
.msg > b{
  display:block; padding:12px 16px; border-radius:18px;
  border:4px solid var(--ink); background:var(--pink); color:var(--ink);
  font-size:13px; line-height:1.5; font-weight:700;
}
.msg.ok > b{background:var(--lime)}
.btn-main{
  width:100%; min-height:68px; border-radius:999px; cursor:pointer;
  border:5px solid var(--ink); background:var(--lime); color:var(--ink);
  font-family:var(--disp); font-size:26px; box-shadow:8px 8px 0 var(--ink);
  display:inline-flex; align-items:center; justify-content:center; gap:12px;
}
.btn-main:hover{transform:translate(2px,2px); box-shadow:4px 4px 0 var(--ink)}
.admin-slot{display:flex; flex-direction:column; gap:12px}
.rule{height:4px; background:var(--ink); border-radius:999px}
.btn-admin{
  width:100%; min-height:56px; border-radius:999px; cursor:pointer;
  border:4px solid var(--ink); background:var(--ink); color:var(--lime);
  font-family:var(--disp); font-size:17px;
  display:inline-flex; align-items:center; justify-content:center; gap:10px;
}
.btn-admin:hover{background:var(--panel)}

/* result panes */
.result{gap:18px; text-align:center}
.result .badge{
  align-self:center; width:96px; height:96px; border-radius:50%;
  border:5px solid var(--ink); background:var(--lime);
  display:flex; align-items:center; justify-content:center;
}
.result.admin .badge{background:var(--pink)}
.result h2{margin:0; font-family:var(--disp); font-size:34px; line-height:1.15}
.who{
  align-self:center; display:inline-flex; align-items:center; gap:10px;
  min-height:44px; padding:0 18px; border-radius:999px; border:4px solid var(--ink);
}
.who .k{font-family:var(--num); font-size:11px; letter-spacing:.14em; color:#5B4470}
.who .v{font-family:var(--num); font-size:15px}
.btn-ghost{
  width:100%; min-height:52px; border-radius:999px; cursor:pointer;
  border:4px solid var(--ink); background:transparent; color:var(--ink);
  font-family:var(--disp); font-size:16px;
  display:inline-flex; align-items:center; justify-content:center;
}
.btn-ghost:hover{background:#EFE6F6}
.stack{display:flex; flex-direction:column; gap:12px}

/* dialog */
dialog.dlg{
  width:min(420px, calc(100vw - 32px)); padding:26px; border:5px solid var(--line);
  border-radius:28px; background:var(--panel); color:var(--t1);
  box-shadow:10px 10px 0 var(--pink);
}
dialog.dlg::backdrop{background:rgba(20,6,31,.78)}
.dlg-hd{display:flex; align-items:center; gap:14px; margin-bottom:18px}
.dlg-hd .ic{
  width:52px; height:52px; flex:0 0 52px; border-radius:50%;
  background:var(--pink); border:4px solid var(--line);
  display:flex; align-items:center; justify-content:center;
}
.dlg-hd h2{margin:0; font-family:var(--disp); font-size:24px; color:var(--line)}
.dlg form{display:flex; flex-direction:column; gap:16px}
.dlg label{font-family:var(--num); font-size:11px; letter-spacing:.14em; color:var(--t3)}
.dlg input{
  width:100%; min-height:60px; padding:0 18px; border-radius:18px;
  border:4px solid var(--line); background:var(--ink); color:var(--line);
  font-family:var(--num); font-size:22px; letter-spacing:.24em; text-align:center;
}
.dlg .msg > b{border-color:var(--line)}
.dlg-actions{display:flex; gap:12px}
.dlg-actions button{
  flex:1 1 0; min-height:56px; border-radius:999px; cursor:pointer;
  font-family:var(--disp); font-size:17px; border:4px solid var(--line);
}
.dlg-actions .go{background:var(--pink); color:var(--ink)}
.dlg-actions .go:hover{background:var(--lime)}
.dlg-actions .no{background:transparent; color:var(--t1)}
.dlg-actions .no:hover{background:var(--dim)}

button[disabled]{opacity:.45; cursor:not-allowed}
.btn-main[disabled]:hover{transform:none; box-shadow:8px 8px 0 var(--ink)}

@media (max-width:640px){
  .stage{min-height:0}
  .hd{padding:0 16px; gap:10px}
  .wordmark{font-size:19px}
  .build .lbl{display:none}
  .body{padding:16px; align-items:flex-start}
  .auth{padding:20px; border-radius:24px; box-shadow:6px 6px 0 var(--lime)}
  .btn-main{font-size:22px; min-height:60px}
}
@media (prefers-reduced-motion:reduce){
  *{transition:none !important}
  .btn-main:hover{transform:none}
}
</style>
</head>
<body>

<div class="halftone" aria-hidden="true"></div>

<div class="stage">
  <div class="blob" aria-hidden="true"></div>

  <header class="hd">
    <span class="logo" aria-hidden="true">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#14061F" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2 4 14h6l-1 8 9-12h-6l1-8Z"/></svg>
    </span>
    <span class="wordmark">데미갓 아카데미</span>
    <span class="spacer"></span>
    <span class="build">
      <span class="lbl">SEASON</span>
      <span class="val">01</span>
    </span>
  </header>

  <div class="body">
    <main class="auth">
      <div class="seg" role="tablist" aria-label="입장 방식">
        <button type="button" class="seg-btn" id="tabLogin" role="tab" aria-selected="true" aria-controls="paneLogin">로그인</button>
        <button type="button" class="seg-btn" id="tabSignup" role="tab" aria-selected="false" aria-controls="paneSignup">가입</button>
      </div>

      <!-- 로그인 -->
      <form class="pane" id="paneLogin" role="tabpanel" aria-labelledby="tabLogin" novalidate>
        <div class="field">
          <label for="loginId">아이디</label>
          <div class="inputwrap">
            <input id="loginId" name="loginId" type="text" autocomplete="username" placeholder="영문·숫자 4~16자" required>
          </div>
        </div>
        <div class="field">
          <label for="loginPw">비밀번호</label>
          <div class="inputwrap">
            <input id="loginPw" name="loginPw" type="password" autocomplete="current-password" placeholder="8자 이상" required>
            <button type="button" class="peek" data-peek="loginPw" aria-label="비밀번호 표시">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.8-6 10-6 10 6 10 6-3.8 6-10 6-10-6-10-6Z"/><circle cx="12" cy="12" r="2.8"/></svg>
            </button>
          </div>
        </div>
        <label class="remember" for="remember">
          <input id="remember" name="remember" type="checkbox">
          <span>아이디 기억하기</span>
        </label>
        <div class="msg" id="loginMsg" role="status" aria-live="polite"></div>
        <button type="submit" class="btn-main">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#14061F" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 4H6a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h4"/><path d="M15 12H9"/><path d="m18 12-3.5-3.5M18 12l-3.5 3.5"/></svg>
          입장하기
        </button>

        <div class="admin-slot">
          <div class="rule" aria-hidden="true"></div>
          <button type="button" class="btn-admin" id="adminOpen">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="10" width="16" height="10" rx="2.5"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
            관리자 입장
          </button>
        </div>
      </form>

      <!-- 가입 -->
      <form class="pane" id="paneSignup" role="tabpanel" aria-labelledby="tabSignup" hidden novalidate>
        <div class="field">
          <label for="newId">아이디</label>
          <div class="inputwrap">
            <input id="newId" name="newId" type="text" autocomplete="username" placeholder="영문·숫자 4~16자" required>
          </div>
        </div>
        <div class="field">
          <label for="newPw">비밀번호</label>
          <div class="inputwrap">
            <input id="newPw" name="newPw" type="password" autocomplete="new-password" placeholder="영문+숫자 8자 이상" required>
            <button type="button" class="peek" data-peek="newPw" aria-label="비밀번호 표시">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.8-6 10-6 10 6 10 6-3.8 6-10 6-10-6-10-6Z"/><circle cx="12" cy="12" r="2.8"/></svg>
            </button>
          </div>
        </div>
        <div class="field">
          <label for="newPw2">비밀번호 확인</label>
          <div class="inputwrap">
            <input id="newPw2" name="newPw2" type="password" autocomplete="new-password" placeholder="한 번 더" required>
          </div>
        </div>
        <div class="msg" id="signupMsg" role="status" aria-live="polite"></div>
        <button type="submit" class="btn-main">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#14061F" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 19h6"/><path d="M19 16v6"/><circle cx="10" cy="8" r="4"/><path d="M3 20c.7-3.6 3.4-5.5 7-5.5 1 0 1.9.15 2.7.43"/></svg>
          가입하기
        </button>
      </form>

      <!-- 로그인 성공 -->
      <div class="pane result" id="paneWelcome" hidden>
        <span class="badge" aria-hidden="true">
          <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="#14061F" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m5 13 4 4 10-10"/></svg>
        </span>
        <h2>입장 완료</h2>
        <span class="who"><span class="k">ID</span><span class="v" id="whoId">—</span></span>
        <div class="stack">
          <a class="btn-main" href="lobby.html" style="text-decoration:none">로비로 가기</a>
          <button type="button" class="btn-ghost" data-logout>다른 아이디로 입장</button>
        </div>
      </div>

      <!-- 관리자 모드 -->
      <div class="pane result admin" id="paneAdmin" hidden>
        <span class="badge" aria-hidden="true">
          <svg width="42" height="42" viewBox="0 0 24 24" fill="none" stroke="#14061F" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10" width="16" height="10" rx="2.5"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/><path d="M12 14v2"/></svg>
        </span>
        <h2>관리자 모드</h2>
        <div class="stack">
          <button type="button" class="btn-main" id="adminGo">관리자 콘솔 열기</button>
          <button type="button" class="btn-ghost" data-logout>나가기</button>
        </div>
      </div>
    </main>
  </div>
</div>

<dialog class="dlg" id="adminDlg" aria-labelledby="adminDlgTitle">
  <div class="dlg-hd">
    <span class="ic" aria-hidden="true">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#14061F" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10" width="16" height="10" rx="2.5"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
    </span>
    <h2 id="adminDlgTitle">관리자 코드</h2>
  </div>
  <form method="dialog" id="adminForm" novalidate>
    <div class="field">
      <label for="adminCode">ADMIN CODE · 9자리</label>
      <input id="adminCode" name="adminCode" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="9" autocomplete="off" placeholder="000000000">
    </div>
    <div class="msg" id="adminMsg" role="status" aria-live="polite"></div>
    <div class="dlg-actions">
      <button type="button" class="no" id="adminCancel">취소</button>
      <button type="submit" class="go">확인</button>
    </div>
  </form>
</dialog>

<script>
/* ── 화면 조작 ──────────────────────────────────────────────
   파이어베이스 SDK가 안 뜨더라도 탭·비밀번호 보기·관리자 입장은 동작하도록
   인증과 분리해 둔다. 인증 쪽은 아래 module 스크립트가 붙인다. */
(function () {
  'use strict';

  var $ = function (sel) { return document.querySelector(sel); };

  var tabLogin = $('#tabLogin'), tabSignup = $('#tabSignup');
  var paneLogin = $('#paneLogin'), paneSignup = $('#paneSignup');
  var paneWelcome = $('#paneWelcome'), paneAdmin = $('#paneAdmin');
  var seg = document.querySelector('.seg');

  function say(box, text, ok) {
    box.className = 'msg' + (ok ? ' ok' : '');
    box.textContent = '';
    if (!text) return;
    var b = document.createElement('b');
    b.textContent = text;
    box.appendChild(b);
  }

  function showTab(which) {
    var toLogin = which === 'login';
    tabLogin.setAttribute('aria-selected', String(toLogin));
    tabSignup.setAttribute('aria-selected', String(!toLogin));
    paneLogin.hidden = !toLogin;
    paneSignup.hidden = toLogin;
    paneWelcome.hidden = true;
    paneAdmin.hidden = true;
    seg.hidden = false;
  }

  function showResult(pane) {
    paneLogin.hidden = true;
    paneSignup.hidden = true;
    paneWelcome.hidden = pane !== paneWelcome;
    paneAdmin.hidden = pane !== paneAdmin;
    seg.hidden = true;
  }

  function busy(form, on) {
    var btn = form.querySelector('button[type="submit"]');
    if (btn) btn.disabled = !!on;
  }

  tabLogin.addEventListener('click', function () { showTab('login'); $('#loginId').focus(); });
  tabSignup.addEventListener('click', function () { showTab('signup'); $('#newId').focus(); });

  Array.prototype.forEach.call(document.querySelectorAll('.peek'), function (btn) {
    btn.addEventListener('click', function () {
      var input = document.getElementById(btn.getAttribute('data-peek'));
      var show = input.type === 'password';
      input.type = show ? 'text' : 'password';
      btn.setAttribute('aria-label', show ? '비밀번호 숨기기' : '비밀번호 표시');
      input.focus();
    });
  });

  /* 관리자 코드 — 이 판정은 브라우저 안에서만 이뤄진다. 소스를 열면 코드가 보인다. */
  var ADMIN_CODE = '316316316';
  var dlg = $('#adminDlg');
  var adminMsg = $('#adminMsg');
  var adminCode = $('#adminCode');
  var tries = 0;

  $('#adminOpen').addEventListener('click', function () {
    say(adminMsg, '');
    adminCode.value = '';
    if (typeof dlg.showModal === 'function') dlg.showModal();
    else dlg.setAttribute('open', '');
    adminCode.focus();
  });
  $('#adminCancel').addEventListener('click', function () { dlg.close(); });

  $('#adminForm').addEventListener('submit', function (e) {
    e.preventDefault();
    if (adminCode.value === ADMIN_CODE) {
      tries = 0;
      dlg.close();
      say(adminMsg, '');
      adminCode.value = '';
      showResult(paneAdmin);
      $('#adminGo').focus();
    } else {
      tries += 1;
      say(adminMsg, '코드가 맞지 않습니다. (' + tries + '회 실패)');
      adminCode.value = '';
      adminCode.focus();
    }
  });

  $('#adminGo').addEventListener('click', function () {
    alert('관리자 콘솔은 다음 화면에서 만듭니다.');
  });

  Array.prototype.forEach.call(document.querySelectorAll('[data-logout]'), function (btn) {
    btn.addEventListener('click', function () {
      if (typeof window.DGA.onLogout === 'function') window.DGA.onLogout();
      showTab('login');
      say($('#loginMsg'), '');
      $('#loginPw').value = '';
      $('#loginId').focus();
    });
  });

  window.DGA = {
    $: $, say: say, showTab: showTab, showResult: showResult, busy: busy,
    onLogout: null,
    panes: { login: paneLogin, signup: paneSignup, welcome: paneWelcome, admin: paneAdmin }
  };

  /* 인증 모듈(module 스크립트)이 끝내 뜨지 않으면 폼을 잠그고 이유를 알린다 */
  setTimeout(function () {
    if (window.DGA.authReady) return;
    var note = '인증 모듈을 불러오지 못했습니다. 새로고침하거나 네트워크 연결을 확인해 주세요.';
    say($('#loginMsg'), note);
    say($('#signupMsg'), note);
    busy(paneLogin, true);
    busy(paneSignup, true);
  }, 8000);
})();
</script>

<script type="module">
/* ── 인증 (Firebase Authentication · 이메일/비밀번호) ──────────── */
import {
  setPersistence, browserLocalPersistence, browserSessionPersistence,
  createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut,
  updateProfile, onAuthStateChanged
} from 'https://www.gstatic.com/firebasejs/11.0.2/firebase-auth.js';
import { auth, emailOf, idOf } from './firebase-init.js';

const UI = window.DGA;
UI.authReady = true;

const $ = UI.$;
const loginMsg = $('#loginMsg');
const signupMsg = $('#signupMsg');
const LAST_ID_KEY = 'demigod.lastId';
const ID_RE = /^[A-Za-z0-9_]{4,16}$/;

function reason(err) {
  switch (err && err.code) {
    case 'auth/email-already-in-use':
      return '이미 쓰이고 있는 아이디입니다. 다른 아이디를 골라 주세요.';
    case 'auth/invalid-credential':
    case 'auth/wrong-password':
    case 'auth/user-not-found':
      return '아이디 또는 비밀번호가 맞지 않습니다. 처음이라면 가입 탭에서 아이디를 먼저 만들어 주세요.';
    case 'auth/too-many-requests':
      return '잠시 후 다시 시도해 주세요. 실패가 반복돼 접속이 잠시 막혔습니다.';
    case 'auth/network-request-failed':
      return '네트워크에 연결하지 못했습니다. 연결 상태를 확인하고 다시 시도해 주세요.';
    case 'auth/operation-not-allowed':
      return '파이어베이스 콘솔에서 이메일/비밀번호 로그인을 켜 주세요.';
    case 'auth/unauthorized-domain':
      return '이 주소는 아직 파이어베이스 승인된 도메인이 아닙니다. 콘솔에서 추가해 주세요.';
    case 'auth/weak-password':
      return '비밀번호가 너무 짧습니다. 8자 이상으로 만들어 주세요.';
    default:
      return '입장에 실패했습니다. (' + ((err && err.code) || 'unknown') + ')';
  }
}

/* 이미 로그인돼 있으면 메인으로 */
onAuthStateChanged(auth, (user) => {
  if (!user) return;
  $('#whoId').textContent = idOf(user);
  UI.showResult(UI.panes.welcome);
});

/* 가입 */
UI.panes.signup.addEventListener('submit', async (e) => {
  e.preventDefault();
  const id = $('#newId').value.trim();
  const pw = $('#newPw').value;
  const pw2 = $('#newPw2').value;

  if (!ID_RE.test(id)) {
    UI.say(signupMsg, '아이디는 영문·숫자·밑줄 4~16자로 만들어 주세요.'); $('#newId').focus(); return;
  }
  if (pw.length < 8 || !/[A-Za-z]/.test(pw) || !/[0-9]/.test(pw)) {
    UI.say(signupMsg, '비밀번호는 영문과 숫자를 섞어 8자 이상으로 만들어 주세요.'); $('#newPw').focus(); return;
  }
  if (pw !== pw2) {
    UI.say(signupMsg, '두 비밀번호가 다릅니다. 확인란을 다시 입력해 주세요.'); $('#newPw2').focus(); return;
  }

  UI.busy(UI.panes.signup, true);
  UI.say(signupMsg, '아이디를 만드는 중…', true);
  try {
    const cred = await createUserWithEmailAndPassword(auth, emailOf(id), pw);
    await updateProfile(cred.user, { displayName: id });
    $('#newPw').value = '';
    $('#newPw2').value = '';
    UI.say(signupMsg, '');
    $('#whoId').textContent = id;
    UI.showResult(UI.panes.welcome);
  } catch (err) {
    UI.say(signupMsg, reason(err));
  } finally {
    UI.busy(UI.panes.signup, false);
  }
});

/* 로그인 */
UI.panes.login.addEventListener('submit', async (e) => {
  e.preventDefault();
  const id = $('#loginId').value.trim();
  const pw = $('#loginPw').value;

  if (!id || !pw) { UI.say(loginMsg, '아이디와 비밀번호를 모두 입력해 주세요.'); return; }
  if (!ID_RE.test(id)) {
    UI.say(loginMsg, '아이디 또는 비밀번호가 맞지 않습니다.'); $('#loginId').focus(); return;
  }

  const remember = $('#remember').checked;
  UI.busy(UI.panes.login, true);
  UI.say(loginMsg, '입장하는 중…', true);
  try {
    await setPersistence(auth, remember ? browserLocalPersistence : browserSessionPersistence);
    await signInWithEmailAndPassword(auth, emailOf(id), pw);
    try {
      if (remember) localStorage.setItem(LAST_ID_KEY, id);
      else localStorage.removeItem(LAST_ID_KEY);
    } catch (_) { /* 저장 불가 환경 */ }
    $('#loginPw').value = '';
    UI.say(loginMsg, '');
    $('#whoId').textContent = id;
    UI.showResult(UI.panes.welcome);
  } catch (err) {
    UI.say(loginMsg, reason(err));
    $('#loginPw').select();
  } finally {
    UI.busy(UI.panes.login, false);
  }
});

UI.onLogout = () => { signOut(auth).catch(() => {}); };

/* 아이디 기억하기 — 입력란만 미리 채운다 */
try {
  const last = localStorage.getItem(LAST_ID_KEY);
  if (last) { $('#loginId').value = last; $('#remember').checked = true; }
} catch (_) { /* 저장 불가 환경 */ }
</script>

</body>
</html>
