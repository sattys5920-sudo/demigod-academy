<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#0B0910">
<title>프로필 만들기 · 데미갓 아카데미</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Black+Han+Sans&family=Do+Hyeon&family=IBM+Plex+Sans+KR:wght@400;600&display=swap">
<link rel="stylesheet" href="theme.css?v=13e7d66b">
<link rel="stylesheet" href="page.css?v=9874dc03">
</head>
<body>

<div class="halftone" aria-hidden="true"></div>

<div id="gate" role="status" aria-live="polite">
  <div class="box">
    <span class="ring" aria-hidden="true">
      <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#14061F" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2 4 14h6l-1 8 9-12h-6l1-8Z"/></svg>
    </span>
    <p id="gateTitle">입장 확인 중</p>
    <small id="gateNote">잠시만 기다려 주세요.</small>
  </div>
</div>

<div class="app">

  <header class="hd">
    <span class="logo" aria-hidden="true">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#14061F" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2 4 14h6l-1 8 9-12h-6l1-8Z"/></svg>
    </span>
    <h1>프로필 만들기</h1>
    <span class="spacer"></span>
    <span class="step">STEP 2 / 2</span>
  </header>

  <div class="body">
    <div class="col-main">

      <section class="panel">
        <div class="sect-h">
          <span class="eyebrow">AVATAR</span>
          <h2>문장 고르기</h2>
        </div>
        <p class="hint" style="margin-bottom:16px">
          네 피에 흐르는 신의 문장을 하나 골라. 아바타와 계열이 함께 정해진다.
        </p>
        <div class="sigs" id="sigs" role="group" aria-label="신성 계열 문장"></div>
      </section>

      <section class="panel">
        <div class="sect-h">
          <span class="eyebrow">PHOTO</span>
          <h2>사진으로 바꾸기</h2>
        </div>
        <p class="hint" style="margin-bottom:16px">
          원하면 사진을 올려 아바타로 쓸 수 있다. 정사각 160px 로 줄여 이 기기에만 담는다.
        </p>
        <div class="upload">
          <button type="button" class="btn white" id="pickPhoto">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#14061F" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="6" width="18" height="14" rx="3"/><circle cx="12" cy="13" r="3.4"/><path d="M8 6l1.4-2h5.2L16 6"/></svg>
            사진 고르기
          </button>
          <button type="button" class="btn ghost block" id="dropPhoto" hidden>사진 지우고 문장 쓰기</button>
          <input type="file" id="photoInput" accept="image/*" hidden>
        </div>
        <p class="msg" id="photoMsg" role="status" aria-live="polite"></p>
      </section>

    </div>

    <div class="col-side">
      <div class="card-prev">
        <div class="art">
          <span class="ava" id="prevAva" aria-hidden="true"></span>
        </div>
        <h2 class="nm" id="prevName">이름 없음</h2>
        <span class="fam" id="prevFam">ZEUS · 하늘과 번개</span>
      </div>

      <section class="panel flat">
        <div class="field">
          <label for="nameInput">표시 이름</label>
          <input type="text" id="nameInput" maxlength="20" autocomplete="nickname"
                 placeholder="아카데미에서 불릴 이름" enterkeyhint="done">
          <div class="foot">
            <span class="hint" style="flex:1 1 auto">무엇이든 쓸 수 있다. 20자까지.</span>
            <span class="len" id="nameLen">0 / 20</span>
          </div>
        </div>
        <p class="msg" id="saveMsg" role="status" aria-live="polite"></p>
        <button type="button" class="btn lg block" id="save">아카데미 입학</button>
      </section>

      <button type="button" class="btn ghost block" id="logout" style="width:100%">다른 아이디로 입장</button>
    </div>
  </div>
</div>

<script>
/* 파이어베이스 SDK 가 끝내 안 뜨면 게이트에 갇히지 않게 빠져나갈 길을 준다 */
setTimeout(function () {
  if (window.__authResolved) return;
  var box = document.querySelector('#gate .box');
  if (!box) return;
  document.getElementById('gateTitle').textContent = '연결하지 못했습니다';
  document.getElementById('gateNote').textContent =
    '인증 모듈을 불러오지 못했습니다. 네트워크 연결을 확인하고 새로고침해 주세요.';
  var a = document.createElement('a');
  a.href = 'index.html';
  a.textContent = '로그인 화면으로';
  box.appendChild(a);
}, 8000);
</script>

<script type="module">
import { onAuthStateChanged, signOut, updateProfile } from 'https://www.gstatic.com/firebasejs/11.0.2/firebase-auth.js';
import { auth, idOf } from './firebase-init.js';
import { GODS, godOf, loadProfile, saveProfile, paintAvatar, shrinkImage } from './profile.js';

const $ = (sel) => document.querySelector(sel);
const prevAva = $('#prevAva');
const prevName = $('#prevName');
const prevFam = $('#prevFam');
const nameInput = $('#nameInput');
const nameLen = $('#nameLen');
const saveMsg = $('#saveMsg');
const photoMsg = $('#photoMsg');
const dropPhoto = $('#dropPhoto');

let uid = '';
let draft = { god: 'zeus', photo: '', name: '' };

function say(box, text, ok) {
  box.className = 'msg' + (ok ? ' ok' : '');
  box.textContent = text || '';
}

/* ── 문장 12개 그리기 ─────────────────────────── */
const sigs = $('#sigs');
GODS.forEach((god) => {
  const btn = document.createElement('button');
  btn.type = 'button';
  btn.className = 'sig';
  btn.setAttribute('aria-pressed', 'false');
  btn.dataset.god = god.key;

  const mark = document.createElement('span');
  mark.className = 'mark';
  paintAvatar(mark, { god: god.key }, 58);

  const nm = document.createElement('span');
  nm.className = 'nm';
  nm.textContent = god.name;

  const ln = document.createElement('span');
  ln.className = 'ln';
  ln.textContent = god.line;

  btn.append(mark, nm, ln);
  btn.addEventListener('click', () => {
    draft.god = god.key;
    draft.photo = '';
    say(photoMsg, '');
    paint();
  });
  sigs.appendChild(btn);
});

function paint() {
  const god = godOf(draft.god);
  Array.prototype.forEach.call(sigs.querySelectorAll('.sig'), (btn) => {
    btn.setAttribute('aria-pressed', String(!draft.photo && btn.dataset.god === draft.god));
  });
  paintAvatar(prevAva, draft, 104);
  prevName.textContent = draft.name || '이름 없음';
  prevFam.textContent = god.key.toUpperCase() + ' · ' + god.line;
  dropPhoto.hidden = !draft.photo;
  nameLen.textContent = [...draft.name].length + ' / 20';
}

/* ── 이름 ─────────────────────────────────────── */
nameInput.addEventListener('input', () => {
  draft.name = nameInput.value;
  say(saveMsg, '');
  paint();
});

/* ── 사진 ─────────────────────────────────────── */
$('#pickPhoto').addEventListener('click', () => $('#photoInput').click());
dropPhoto.addEventListener('click', () => {
  draft.photo = '';
  say(photoMsg, '');
  paint();
});
$('#photoInput').addEventListener('change', async (e) => {
  const file = e.target.files && e.target.files[0];
  e.target.value = '';
  if (!file) return;
  say(photoMsg, '사진을 줄이는 중…', true);
  try {
    draft.photo = await shrinkImage(file, 160);
    say(photoMsg, '사진을 아바타로 쓴다. 문장을 다시 누르면 되돌아간다.', true);
    paint();
  } catch (err) {
    say(photoMsg, err.message || '사진을 읽지 못했습니다.');
  }
});

/* ── 저장 ─────────────────────────────────────── */
$('#save').addEventListener('click', async () => {
  const name = nameInput.value.trim();
  if (!name) {
    say(saveMsg, '표시 이름을 입력해 주세요.');
    nameInput.focus();
    return;
  }
  draft.name = name;
  const btn = $('#save');
  btn.disabled = true;
  say(saveMsg, '프로필을 새기는 중…', true);

  const stored = saveProfile(uid, { god: draft.god, photo: draft.photo, name: name });
  if (!stored) {
    btn.disabled = false;
    say(saveMsg, '이 브라우저가 저장을 막고 있습니다. 시크릿 창이면 일반 창에서 다시 시도해 주세요.');
    return;
  }
  /* 이름은 파이어베이스 계정에도 남겨 다른 기기에서도 따라오게 한다 */
  try { await updateProfile(auth.currentUser, { displayName: name }); } catch (_) { /* 이름만 못 옮긴 것 */ }
  location.replace('app.html');
});

/* ── 입장 확인 ────────────────────────────────── */
onAuthStateChanged(auth, (user) => {
  window.__authResolved = true;
  if (!user) { location.replace('index.html'); return; }
  uid = user.uid;

  const saved = loadProfile(uid);
  if (saved) {
    draft = { god: saved.god || 'zeus', photo: saved.photo || '', name: saved.name || '' };
    $('#save').textContent = '프로필 저장';
    document.querySelector('.hd h1').textContent = '프로필 고치기';
    $('.step').textContent = 'EDIT';
  } else {
    draft.name = idOf(user) || '';
  }
  nameInput.value = draft.name;
  paint();
  const gate = document.getElementById('gate');
  if (gate) gate.remove();
  nameInput.focus();
});

document.getElementById('logout').addEventListener('click', async () => {
  try { await signOut(auth); } catch (_) { /* 이미 끊긴 세션 */ }
  location.replace('index.html');
});
</script>

</body>
</html>
